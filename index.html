<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clint Humphrey Photography — Fine-Art Prints</title>
<meta name="description" content="Fine-art photographic prints by Clint Humphrey — birds of prey, water birds, mammals, and Americana. Printed to order, shipped worldwide.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Clint Humphrey Photography">
<meta property="og:title" content="Clint Humphrey Photography — Fine-Art Prints">
<meta property="og:image" content="https://clint-humphrey-photography.vercel.app/images/new/amber-eye.jpg">
<meta property="og:url" content="https://clint-humphrey-photography.vercel.app/">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">Clint Humphrey <span>Photography</span></a>
    <nav class="main">
      <a href="index.html" class="active">Home</a>
      <a href="gallery.html">Prints</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<div id="groups" style="padding-top:84px;max-width:1200px;margin:0 auto;padding-left:20px;padding-right:20px;">
  <div class="coll-grid" id="group-grid"></div>
</div>

<footer class="site">
  <div class="wrap wide">
    <div class="base">
      <span>© 2026 Clint Humphrey Photography. All images copyright the artist.</span>
      <span>Printed to order · Shipped worldwide</span>
    </div>
  </div>
</footer>

<script src="js/site.js?v=3"></script>
<script src="js/products-new.js?v=6"></script>
<script src="js/collections.js?v=6"></script>
<script>
  // Homepage: top-level group cards. Tap a group to see its sub-collections.
  const grid = document.getElementById('group-grid');
  COLLECTION_GROUPS.forEach(g => {
    const meta = GROUP_META[g.name];
    if (!meta) return;
    const n = countInGroup(g.name);
    // Single-collection groups link straight to the gallery
    const href = g.collections.length === 1
      ? `gallery.html?c=${g.collections[0]}`
      : `group.html?g=${groupSlug(g.name)}`;
    grid.innerHTML += `
      <a class="coll-card" href="${href}">
        <img loading="lazy" src="${meta.image}" alt="${g.name}">
        <div class="card-label">${g.name}</div>
        <div class="card-sub">${n} prints</div>
      </a>`;
  });
</script>
</body>
</html>
