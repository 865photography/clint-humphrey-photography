<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clint Humphrey Photography — Fine-Art Prints</title>
<meta name="description" content="Fine-art photographic prints by Clint Humphrey — birds, mammals, and Americana. Printed to order, shipped worldwide.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Clint Humphrey Photography">
<meta property="og:title" content="Clint Humphrey Photography — Fine-Art Prints">
<meta property="og:image" content="https://clint-humphrey-photography.vercel.app/images/new/amber-eye.jpg">
<meta property="og:url" content="https://clint-humphrey-photography.vercel.app/">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">Clint Humphrey <span>Photography</span></a>
    <nav class="main">
      <a href="index.html" class="active">Home</a>
      <a href="gallery.html">Prints</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<div id="groups" style="padding-top:84px"></div>

<footer class="site">
  <div class="wrap wide">
    <div class="base">
      <span>© 2026 Clint Humphrey Photography. All images copyright the artist.</span>
      <span>Printed to order · Shipped worldwide</span>
    </div>
  </div>
</footer>

<script src="js/site.js?v=3"></script>
<script src="js/products-new.js?v=4"></script>
<script src="js/collections.js?v=3"></script>
<script>
  const groupsEl = document.getElementById('groups');
  COLLECTION_GROUPS.forEach(g => {
    let html = `<h2 class="section-title">${g.name}</h2><div class="coll-grid">`;
    g.collections.forEach(slug => {
      const meta = COLLECTION_META[slug];
      const n = countInCollection(slug);
      if (!meta || n === 0) return;
      html += `
        <a class="coll-card" href="gallery.html?c=${slug}">
          <img loading="lazy" src="${meta.image}" alt="${collectionName(slug)}">
          <div class="card-label">${collectionName(slug)}</div>
        </a>`;
    });
    html += `</div>`;
    groupsEl.innerHTML += html;
  });
</script>
</body>
</html>
