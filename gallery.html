<script>
  document.addEventListener('DOMContentLoaded', function () {
    var params = new URLSearchParams(location.search);
    var activeC = params.get('c');
    var activeG = params.get('g');
    var valid = CHPApp.populatedCollections();
    if (activeC && valid.indexOf(activeC) === -1) activeC = null;
    var group = activeG ? CHPApp.groupBySlug(activeG) : null;
    if (group && !group.collections.some(function (s) { return valid.indexOf(s) !== -1; })) group = null;

    var filtersEl = document.getElementById('filters');
    var grid = document.getElementById('grid');

    function currentPairs() {
      if (activeC) return CHPApp.productsIn(activeC);
      if (group) {
        var out = [];
        group.collections.forEach(function (slug) {
          if (valid.indexOf(slug) !== -1) out = out.concat(CHPApp.productsIn(slug));
        });
        return out;
      }
      var out = [];
      valid.forEach(function (slug) { out = out.concat(CHPApp.productsIn(slug)); });
      return out;
    }

    function setActive(c, g) {
      activeC = c; activeG = g || null;
      group = activeG ? CHPApp.groupBySlug(activeG) : null;
      var url = 'gallery.html' + (c ? '?c=' + c : (activeG ? '?g=' + activeG : ''));
      history.replaceState(null, '', url);
      render();
    }

    function render() {
      filtersEl.innerHTML = '';
      function mk(label, isOn, onClick, n) {
        var b = document.createElement('button');
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', isOn ? 'true' : 'false');
        b.innerHTML = CHPApp.esc(label) + (typeof n === 'number' ? ' <span class="n">' + n + '</span>' : '');
        if (isOn) b.classList.add('on');
        b.addEventListener('click', onClick);
        filtersEl.appendChild(b);
      }
      mk('All', !activeC && !group, function () { setActive(null, null); });
      valid.forEach(function (slug) {
        var on = activeC === slug;
        mk(CHP.collections[slug].name, on, function () { setActive(slug, null); }, CHPApp.countIn(slug));
      });

      var pairs = currentPairs();
      CHPApp.renderGrid(grid, pairs);

      // Lightbox: click a card to view large
      grid.querySelectorAll('.card').forEach(function (card, i) {
        card.addEventListener('click', function (e) {
          // Let modifier/ long-press open the photo page normally
          if (e.metaKey || e.ctrlKey || e.shiftKey) return;
          e.preventDefault();
          CHPApp.openLightbox(pairs, i);
        });
      });
    }

    render();

  });
</script>
